<style>
:root{--bg:#f4f6ff;--sf:#fff;--tx:#12163a;--mu:#6b7194;--ac:#5b3df5;--ac2:#00b4ff;--bd:#dfe3f7;--me:#5b3df5;--metx:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#070a22;--sf:#111638;--tx:#eef0ff;--mu:#8f95c4;--bd:#232a5c}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#070a22;--sf:#111638;--tx:#eef0ff;--mu:#8f95c4;--bd:#232a5c}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,"Noto Sans Ethiopic","Nyala",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--sf)}
header img{width:44px;height:44px;border-radius:12px}
header h1{font-size:18px;margin:0}header p{margin:0;font-size:12px;color:var(--mu)}
#chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px}
.chip{flex:none;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:20px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border-color:transparent}
#log{flex:1;overflow-y:auto;padding:6px 14px 14px;display:flex;flex-direction:column;gap:12px}
.m{max-width:88%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}
.m.u{align-self:flex-end;background:var(--me);color:var(--metx);border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:var(--sf);border:1px solid var(--bd);border-bottom-left-radius:4px}
.m img{max-width:100%;border-radius:10px;display:block;margin-bottom:6px}
.cp{display:block;margin-top:8px;border:0;background:none;color:var(--ac);font:inherit;font-size:13px;cursor:pointer;padding:0}
#hi{text-align:center;color:var(--mu);margin:auto;padding:20px}
#hi img{width:96px;height:96px;border-radius:24px}
#bar{padding:8px 12px;border-top:1px solid var(--bd);background:var(--sf)}
#pv{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
#pv div{position:relative}#pv img{width:56px;height:56px;object-fit:cover;border-radius:10px}
#pv button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:#e5484d;color:#fff;font-size:12px;line-height:20px;padding:0}
#row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;max-height:140px;border:1px solid var(--bd);border-radius:20px;padding:10px 14px;font:inherit;background:var(--bg);color:var(--tx);outline:none}
.ib{flex:none;width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;font-size:20px;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
#go{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}
#go:disabled{opacity:.5}
#note{font-size:12px;color:var(--mu);text-align:center;margin-top:4px;min-height:16px}
#auth,#st{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px}
#auth{background:var(--bg)}#st{background:rgba(0,0,0,.55)}
.login-form{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;padding:22px;background:#1e1e1e;border-radius:12px;color:#fff;font-family:Arial,sans-serif}
.login-form img{width:64px;height:64px;border-radius:16px;align-self:center}
.login-form h2{margin:0;text-align:center}
.login-form input,.login-form button{padding:11px;border:0;border-radius:6px;font:inherit}
.login-form button{background:#007bff;color:#fff;cursor:pointer}
.login-form .g{background:#fff;color:#222;opacity:.55;cursor:not-allowed}
.signup{margin:0;text-align:center;font-size:14px}.signup a{color:#4da3ff}
#err{color:#ff7b7b;font-size:13px;min-height:16px;text-align:center}
.small{font-size:11px;color:#9aa;text-align:center;margin:0}
.card{background:var(--sf);color:var(--tx);border-radius:16px;padding:18px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}

<script>
const MODES={"ሁሉም":"General helper: do whatever the person asks.","መልስ ጻፍልኝ":"Write a ready-to-send reply/answer on the person’s behalf (message, email, letter, exam answer, comment) based on their text or the photo. Output mainly the reply itself, then offer one short variation.","ተርጉም":"Translate the text (typed or in the photo) between Amharic and English (or the language they want).","አጠቃልል":"Summarize clearly in short points.","ኮድ":"Write complete, working, well-explained code with short usage notes."};
const SYS="You are a powerful, friendly all-purpose AI assistant inside a mobile app. Reply in the same language the user writes in (default Amharic). If a photo is attached, read and use it carefully. Be accurate, practical and well organized. Current mode: ";
let mode="ሁሉም",hist=[],imgs=[],sample=null,busy=false;
const $=id=>document.getElementById(id),log=$("log"),q=$("q"),note=$("note");
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
Object.keys(MODES).forEach(k=>{const b=el("button","chip"+(k===mode?" on":""),k);b.onclick=()=>{mode=k;[...$("chips").children].forEach(c=>c.classList.toggle("on",c===b))};$("chips").append(b)});
sample=1;
q.oninput=()=>{q.style.height="auto";q.style.height=Math.min(q.scrollHeight,140)+"px"};
$("ph").onclick=()=>$("fi").click();
async function shrink(f){try{const b=await createImageBitmap(f),s=Math.min(1,1400/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=b.width*s;c.height=b.height*s;c.getContext("2d").drawImage(b,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,"image/jpeg",.85))}catch(e){return f}}
$("fi").onchange=async e=>{for(const f of [...e.target.files].slice(0,4-imgs.length)){const b=await shrink(f);imgs.push(b);draw()}e.target.value=""};
function draw(){const p=$("pv");p.textContent="";imgs.forEach((b,i)=>{const d=el("div"),im=el("img"),x=el("button",null,"✕");im.src=URL.createObjectURL(b);x.onclick=()=>{imgs.splice(i,1);draw()};d.append(im,x);p.append(d)})}
function add(role,text,blobs){const h=$("hi");if(h)h.remove();const m=el("div","m "+(role==="user"?"u":"a"));(blobs||[]).forEach(b=>{const i=el("img");i.src=URL.createObjectURL(b);m.append(i)});const s=el("span",null,text);m.append(s);log.append(m);log.scrollTop=log.scrollHeight;return{m,s}}
async function send(){
 const t=q.value.trim();if(busy||(!t&&!imgs.length))return;
 if(!LS.get("key","")){note.textContent="መጀመሪያ በሴቲንግ (⚙️) የAPI ቁልፍ ያስገቡ።";return}
 busy=true;$("go").disabled=true;note.textContent="";
 const my=imgs.slice();imgs=[];draw();q.value="";q.oninput();
 const txt=t||"ፎቶውን ተመልከት እና መልሱን ጻፍልኝ።";
 add("user",t||"📷",my);hist.push({role:"user",content:txt+(my.length?"\n[ፎቶ ተያይዟል]":"")});
 const msgs=hist.map(x=>({...x}));msgs[0].content=SYS+MODES[mode]+(cfg.lang!=="auto"?" ALWAYS reply in "+cfg.lang+".":"")+"\n\n"+msgs[0].content;
 const a=add("assistant","…");let out="";
 try{
  const b64=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(",")[1]);x.readAsDataURL(f)});
  const last=msgs[msgs.length-1];
  if(my.length){last.content=[...await Promise.all(my.map(async f=>({type:"image",source:{type:"base64",media_type:f.type||"image/jpeg",data:await b64(f)}}))),{type:"text",text:last.content}]}
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":LS.get("key",""),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:2000,messages:msgs})});
  const d=await res.json();if(!res.ok)throw{code:res.status,message:d.error&&d.error.message};
  out=d.content.map(x=>x.text||"").join("");a.s.textContent=out;hist.push({role:"assistant",content:out});
  const c=el("button","cp","📋 ቅዳ");c.onclick=async()=>{try{await navigator.clipboard.writeText(out);c.textContent="✓ ተቀድቷል"}catch(e){c.textContent="መቅዳት አልተቻለም"}};a.m.append(c);
 }catch(e){hist.pop();a.s.textContent=e&&e.code===401?"የAPI ቁልፉ ልክ አይደለም።":e&&e.code===429?"ብዙ ጥያቄ ተልኳል፣ ትንሽ ቆይተው ይሞክሩ።":"ስህተት፦ "+((e&&e.message)||"ኢንተርኔትዎን ያረጋግጡ")}
 busy=false;$("go").disabled=false;
}
$("go").onclick=send;
q.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&matchMedia("(hover:hover)").matches){e.preventDefault();send()}};

const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const cfg=Object.assign({lang:"auto",theme:"auto",fs:16},LS.get("cfg",{}));
const LANGS=["auto","አማርኛ (Amharic)","English","Afaan Oromoo (Oromo)","ትግርኛ (Tigrinya)","Soomaali (Somali)","العربية (Arabic)","Français","Español","Português","Deutsch","Italiano","Türkçe","Русский","中文","日本語","한국어","हिन्दी","বাংলা","اردو","Kiswahili","Nederlands","Bahasa Indonesia","Polski","Українська"];
LANGS.forEach(l=>{const o=el("option",null,l==="auto"?"በራስ-ሰር (እንደ ጥያቄዎ)":l);o.value=l;$("sl").append(o)});
function apply(){const r=document.documentElement;cfg.theme==="auto"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",cfg.theme);document.body.style.fontSize=cfg.fs+"px";$("sl").value=cfg.lang;$("sth").value=cfg.theme;$("sf").value=cfg.fs}
function save(){LS.set("cfg",cfg);apply()}
$("sl").onchange=e=>{cfg.lang=e.target.value;save()};$("sth").onchange=e=>{cfg.theme=e.target.value;save()};$("sf").oninput=e=>{cfg.fs=+e.target.value;save()};
$("gear").onclick=()=>$("st").style.display="flex";$("sx").onclick=()=>$("st").style.display="none";
$("clr").onclick=()=>{hist=[];log.textContent="";$("st").style.display="none"};
async function hs(u,p){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("ai-app:"+u+":"+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
let reg=false;
$("sw").onclick=e=>{e.preventDefault();reg=!reg;$("at").textContent=$("ab").textContent=reg?"ተመዝገብ":"ግባ";$("sp").firstChild.textContent=reg?"አካውንት አለዎት? ":"አካውንት የለዎትም? ";$("sw").textContent=reg?"ይግቡ":"ይመዝገቡ";$("err").textContent=""};
function enter(u){$("auth").style.display="none";$("who").textContent="· "+u}
$("lf").onsubmit=async e=>{e.preventDefault();const u=$("lu").value.trim().toLowerCase(),p=$("lp").value,us=LS.get("users",{}),h=await hs(u,p);
 if(reg){if(us[u]){$("err").textContent="ይህ ስም ተይዟል።";return}us[u]=h;LS.set("users",us)}else if(us[u]!==h){$("err").textContent="ስም ወይም የይለፍ ቃል ልክ አይደለም።";return}
 LS.set("sess",u);$("lp").value="";$("err").textContent="";enter(u)};
$("lo").onclick=()=>{LS.set("sess",null);hist=[];log.textContent="";$("st").style.display="none";$("auth").style.display="flex"};
apply();{const s=LS.get("sess",null);s&&LS.get("users",{})[s]?enter(s):$("auth").style.display="flex"}
$("ky").value=LS.get("key","");$("ky").onchange=e=>LS.set("key",e.target.value.trim());
</script></body></html>
